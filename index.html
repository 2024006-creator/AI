<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Bee Finder</title>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <style>
        /* 🐝 벌과 자연 컨셉의 딥그린 & 골드 테마 스타일 */
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            /* 자연 느낌의 딥 그린과 벌집 느낌의 어두운 그라데이션 */
            background: linear-gradient(135deg, #0b1914 0%, #1a1c11 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        header {
            width: 100%;
            padding: 15px 0 5px 0;
            text-align: center;
            background: linear-gradient(to bottom, rgba(11,25,20,1), rgba(11,25,20,0.8));
            z-index: 10;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
            color: #ffd700; /* 벌을 상징하는 골드 옐로우 */
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        p {
            font-size: 0.8rem;
            color: #e2e8f0;
            margin: 3px 0 0 0;
            letter-spacing: 0.5px;
        }

        /* 상태 표시창: 자연 친화적인 황금빛 라임 스타일 */
        #status {
            font-weight: bold;
            background: rgba(212, 163, 89, 0.2);
            color: #ffd700;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            margin: 8px auto;
            backdrop-filter: blur(8px);
            display: inline-block;
            transition: all 0.3s ease;
        }

        /* 📱 카메라 컨테이너 - 골드 허니 테두리 */
        #canvas-container {
            position: relative;
            width: 92%;
            max-width: 450px;
            aspect-ratio: 3 / 4;
            background: #050b08;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 3px solid #d4a359; /* 벌집 느낌의 메탈릭 골드 */
        }

        video { display: none; }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <header>
        <h1>🐝 Smart Bee Finder</h1>
        <p>실시간 벌 탐지 시스템</p>
        <div id="status">⏳ 추론 엔진 로드 중...</div>
    </header>

    <div id="canvas-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="display_canvas"></canvas>
    </div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('display_canvas');
const ctx = canvas.getContext('2d');
const statusDiv = document.getElementById('status');

let session;
const modelWidth = 416;
const modelHeight = 416;

// 🏷️ 벌 탐지 커스텀 모델 클래스 (4개 고정)
const labels = ['bee', 'drone', 'pollenbee', 'queen'];
// 클래스별 박스 색상 정의 (순서대로 꿀벌-골드, 수벌-주황, 화분매개-밝은황토, 여왕벌-네온라임)
const classColors = ["#ffd700", "#ff7f50", "#e9c46a", "#adff2f"];

async function startApp() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 640 },
                height: { ideal: 480 }
            },
            audio: false
        });
        video.srcObject = stream;
        await video.play();

        statusDiv.innerText = "⚡ 인공지능 엔진 최적화 중...";
        statusDiv.style.background = "rgba(255, 215, 0, 0.15)";
        statusDiv.style.color = "#ffd700";
        statusDiv.style.borderColor = "rgba(255, 215, 0, 0.4)";

        // 모델 로드
        session = await ort.InferenceSession.create('./best.onnx', { executionProviders: ['wasm'] });

        statusDiv.innerText = "📱 벌 탐지 가동 중 (후면 카메라)";
        statusDiv.style.background = "rgba(212, 163, 89, 0.2)";
        statusDiv.style.color = "#ffd700";
        statusDiv.style.borderColor = "rgba(212, 163, 89, 0.5)";

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        requestAnimationFrame(processFrame);
    } catch (err) {
        statusDiv.innerText = "❌ 에러: 카메라 권한 부족 또는 best.onnx 없음";
        statusDiv.style.background = "rgba(239, 68, 68, 0.2)";
        statusDiv.style.color = "#ef4444";
        console.error(err);
    }
}

async function processFrame() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const inputTensor = preprocess(video, modelWidth, modelHeight);

        if (inputTensor) {
            try {
                const outputs = await session.run({ images: inputTensor });
                const output = outputs[Object.keys(outputs)[0]]; 

                postprocess(output.data, output.dims);
            } catch (e) {
                console.error("추론 오류:", e);
            }
        }
    }
    requestAnimationFrame(processFrame);
}

function preprocess(img, width, height) {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = width;
    tempCanvas.height = height;
    const tempCtx = tempCanvas.getContext('2d');

    tempCtx.drawImage(img, 0, 0, width, height);

    const imgData = tempCtx.getImageData(0, 0, width, height);
    const data = imgData.data;

    const r = new Float32Array(width * height);
    const g = new Float32Array(width * height);
    const b = new Float32Array(width * height);

    for (let i = 0; i < data.length / 4; i++) {
        r[i] = data[i * 4] / 255.0;
        g[i] = data[i * 4 + 1] / 255.0;
        b[i] = data[i * 4 + 2] / 255.0;
    }

    const float32Data = new Float32Array(width * height * 3);
    float32Data.set(r, 0);
    float32Data.set(g, width * height);
    float32Data.set(b, width * height * 2);

    return new ort.Tensor('float32', float32Data, [1, 3, width, height]);
}

function postprocess(data, dims) {
    const numAttributes = dims[1]; // 구조 변동에 유연하게 대응 (4개 클래스 기준 = 8)
    const numBoxes = dims[2];      

    let candidates = [];

    // 1단계: 탐지 후보군 수집
    for (let i = 0; i < numBoxes; i++) {
        let maxScore = 0;
        let classId = -1;

        // 야외 곤충 특성상 미세 탐지를 위해 인덱스 4부터 클래스 점수 추출
        for (let c = 4; c < numAttributes; c++) {
            const score = data[c * numBoxes + i];
            if (score > maxScore) {
                maxScore = score;
                classId = c - 4;
            }
        }

        // 벌은 크기가 작고 빠르므로 상황에 따라 기준 스코어(0.35~0.40) 조절 권장
        if (maxScore > 0.40 && classId >= 0 && classId < labels.length) {
            const cx = data[0 * numBoxes + i] / modelWidth * canvas.width;
            const cy = data[1 * numBoxes + i] / modelHeight * canvas.height;
            const w = data[2 * numBoxes + i] / modelWidth * canvas.width;
            const h = data[3 * numBoxes + i] / modelHeight * canvas.height;

            const x = cx - w / 2;
            const y = cy - h / 2;

            candidates.push({ x, y, w, h, score: maxScore, classId });
        }
    }

    // 2단계: NMS (중복 제거)
    candidates.sort((a, b) => b.score - a.score);
    let selectedObjects = [];

    while (candidates.length > 0) {
        let box = candidates.shift();
        selectedObjects.push(box);

        candidates = candidates.filter(item => {
            if (item.classId !== box.classId) return true;

            const interX1 = Math.max(box.x, item.x);
            const interY1 = Math.max(box.y, item.y);
            const interX2 = Math.min(box.x + box.w, item.x + item.w);
            const interY2 = Math.min(box.y + box.h, item.y + item.h);

            if (interX2 > interX1 && interY2 > interY1) {
                const interArea = (interX2 - interX1) * (interY2 - interY1);
                const boxArea = box.w * box.h;
                const itemArea = item.w * item.h;
                const iou = interArea / (boxArea + itemArea - interArea);
                return iou < 0.45; // 겹침 허용도를 살짝 타이트하게 조절
            }
            return true;
        });
    }

    // 3단계: 화면 최종 렌더링
    selectedObjects.forEach(obj => {
        // 정의된 클래스별 테마 색상 할당
        const themeColor = classColors[obj.classId] || "#ffd700";

        ctx.strokeStyle = themeColor;
        ctx.lineWidth = 3;
        ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);

        ctx.fillStyle = themeColor;
        const labelName = labels[obj.classId];
        const text = `${labelName} ${Math.round(obj.score * 100)}%`;

        ctx.font = "bold 12px sans-serif";
        const textWidth = ctx.measureText(text).width;

        const labelY = obj.y - 20 < 0 ? 0 : obj.y - 20;
        ctx.fillRect(obj.x - 1, labelY, textWidth + 10, 20);

        // 글자색은 어두운 자연 배경과 어울리는 다크 네이비/그린 계열로 반전
        ctx.fillStyle = "#0b1914";
        ctx.fillText(text, obj.x + 4, labelY + 14);
    });
}

window.onload = startApp;
</script>
</body>
</html>
